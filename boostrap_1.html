<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Grid and Typography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1>Hello, world!</h1>
    <div class="container">
        <div class="row">
            <div class="col-lg-4 col-md-6 col-sm-6" style="background-color: red;">
            Content 1
            </div>
            <div class="col-lg-4 col-md-6 col-sm-6" style="background-color: blue;">
            Content 2
            </div>
            <div class="col-lg-4 col-md-6 col-sm-6" style="background-color: green;">
            Content 3
            </div>
        </div>
    </div>
    <h1 class="h1">Heading 1</h1>
    <p class="h1">Ini adalah heading H1</p>
    <p class="text-primary">Ini adalah text primary</p>
    <p class="text-warning">Ini adalah text warning</p>
    <p class="text-danger">Ini adalah text danger</p>
    <p class="text-success">Ini adalah text success</p>
    <p class="text-center">Ini adalah text yang rata tengah</p>
    <h2>Heading 2</h2>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
